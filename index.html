<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misbah Saeed | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:60px 20px;
    overflow:auto;

    background:linear-gradient(135deg,#0f172a,#111827,#1e3a8a);

    position:relative;

    color:white;

}

/* Animated Background */

body::before,
body::after{

content:"";
position:absolute;

width:450px;
height:450px;

border-radius:50%;

filter:blur(100px);

opacity:.55;

animation:float 12s ease-in-out infinite;

z-index:0;

}

body::before{

background:#2563eb;

top:-180px;
left:-180px;

}

body::after{

background:#06b6d4;

bottom:-180px;
right:-180px;

animation-delay:4s;

}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(40px);
}

}

.card{

position:relative;

z-index:2;

width:100%;
max-width:700px;

padding:45px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:24px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.45);

}

h1{

font-size:3rem;

font-weight:700;

margin-bottom:10px;

}

.line{

width:80px;
height:4px;

margin:0 auto 20px;

border-radius:10px;

background:linear-gradient(to right,#2563eb,#06b6d4);

}

.role{

font-size:1.3rem;

font-weight:500;

color:#7dd3fc;

margin-bottom:28px;

}

.description{

font-size:1.05rem;

line-height:1.8;

color:#d1d5db;

}

.button{

display:inline-block;

margin-top:35px;

padding:15px 38px;

border-radius:50px;

text-decoration:none;

font-weight:600;

font-size:1rem;

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:white;

transition:.3s;

box-shadow:0 10px 30px rgba(37,99,235,.35);

}

.button:hover{

transform:translateY(-4px);

box-shadow:0 18px 40px rgba(37,99,235,.45);

}

.footer{

margin-top:35px;

padding-top:20px;

border-top:1px solid rgba(255,255,255,.12);

font-size:.9rem;

color:#cbd5e1;

letter-spacing:.5px;

}

@media(max-width:768px){

body{

padding:35px 15px;

}

.card{

padding:35px 25px;

}

h1{

font-size:2.3rem;

}

.role{

font-size:1.1rem;

}

.description{

font-size:1rem;

}

.button{

padding:14px 30px;

}

}

</style>

</head>

<body>

<div class="card">

<h1>Misbah Saeed</h1>

<div class="line"></div>

<div class="role">
Backend AI Engineer
</div>

<div class="description">

Welcome to my portfolio.

<br><br>

Currently under development as part of the
<strong>FlyRank Backend AI Engineering Internship</strong>.

<br><br>

Soon, this website will showcase my backend projects,
technical skills, certifications, and learning journey.

</div>

<a href="#" class="button">
🚀 Coming Soon
</a>

<div class="footer">

HTML • CSS • GitHub Pages

</div>

</div>

</body>
</html>
